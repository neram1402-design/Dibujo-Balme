<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NERAM - ART | Recibo de Pago</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Main stylesheet -->
    <link rel="stylesheet" href="styles.css">
    <style>
        /* Asegurar que la tarjeta de recibo use estilos explícitos e independientes de variables CSS para html2pdf/html2canvas */
        #receipt-card-to-print {
            max-width: 440px;
            margin: 0 auto;
            background-color: #ffffff !important;
            color: #202226 !important;
            border: 1px solid #e3e4e6 !important;
            border-radius: 12px !important;
            padding: 28px !important;
            box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.05) !important;
            animation: none !important; /* Desactivar animación para evitar problemas de renderizado en canvas */
        }
        
        .receipt-view-card h1 {
            color: #202226 !important;
            font-size: 1.4rem !important;
            font-weight: 700;
            margin-bottom: 6px;
        }
        
        .receipt-view-card .card-header {
            margin-bottom: 20px !important;
        }
        
        .receipt-view-card .card-header p {
            color: #676b73 !important;
            font-size: 0.85rem !important;
        }

        .receipt-details-table {
            width: 100%;
            border-collapse: collapse;
            margin: 16px 0;
            font-size: 0.9rem !important;
        }
        .receipt-details-table tr {
            border-bottom: 1px dashed #e3e4e6 !important;
        }
        .receipt-details-table tr:last-of-type {
            border-bottom: none !important;
        }
        .receipt-details-table td {
            padding: 10px 0 !important;
        }
        .receipt-details-table td.val-label {
            color: #676b73 !important;
            font-weight: 500;
        }
        .receipt-details-table td.val-content {
            font-weight: 600;
            text-align: right;
            color: #202226 !important;
        }
        .receipt-amount-box {
            background-color: #fcf2f4 !important;
            border: 1px solid #e3e4e6 !important;
            padding: 16px !important;
            border-radius: 8px !important;
            text-align: center;
            margin: 18px 0;
        }
        .receipt-amount-title {
            font-size: 0.7rem !important;
            color: #9c0738 !important;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }
        .receipt-amount-val {
            font-size: 1.6rem !important;
            font-weight: 800;
            color: #9c0738 !important;
        }

        /* Optimizaciones de layout para pantallas de celular */
        @media (max-width: 480px) {
            body {
                padding: 12px 12px 24px 12px !important;
                justify-content: flex-start !important; /* Alinear arriba para evitar desbordamientos */
            }
            .minimalist-container {
                gap: 16px !important;
            }
            #receipt-card-to-print {
                padding: 20px !important;
                border-radius: 12px !important;
            }
            .receipt-view-card h1 {
                font-size: 1.25rem !important;
            }
            .receipt-details-table {
                margin: 12px 0 !important;
            }
            .receipt-details-table td {
                padding: 8px 0 !important;
            }
            .receipt-amount-box {
                padding: 12px !important;
                margin: 14px 0 !important;
            }
            .receipt-amount-val {
                font-size: 1.4rem !important;
            }
        }
    </style>
</head>
<body>
    <!-- Theme Toggle -->
    <div class="top-actions">
        <button id="theme-toggle" class="theme-toggle-btn" aria-label="Cambiar tema de color">
            <i class="fa-solid fa-moon"></i>
        </button>
    </div>

    <!-- Main Container -->
    <main class="minimalist-container">
        <!-- Logo Header -->
        <header class="logo-header">
            <img src="assets/logo.jpg" alt="NERAM - ART Logo" class="brand-logo">
        </header>

        <!-- Receipt Card -->
        <section class="form-card receipt-view-card" id="receipt-card-to-print">
            <div class="card-header">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#9c0738" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="width: 48px; height: 48px; margin: 0 auto 12px auto; display: block;">
                    <circle cx="12" cy="12" r="10" stroke="#9c0738" stroke-width="2" fill="none"></circle>
                    <polyline points="8 12 11 15 16 9"></polyline>
                </svg>
                <h1>Comprobante de Pago</h1>
                <p>NERAM - ART • Libera tu creatividad</p>
            </div>

            <!-- Details -->
            <table class="receipt-details-table">
                <tr>
                    <td class="val-label">Fecha de Pago:</td>
                    <td class="val-content" id="rec-date">-</td>
                </tr>
                <tr>
                    <td class="val-label">Alumno:</td>
                    <td class="val-content" id="rec-student">-</td>
                </tr>
                <tr>
                    <td class="val-label">Tutor:</td>
                    <td class="val-content" id="rec-tutor">-</td>
                </tr>
                <tr>
                    <td class="val-label">Concepto:</td>
                    <td class="val-content" id="rec-concept">-</td>
                </tr>
            </table>

            <!-- Amount Box -->
            <div class="receipt-amount-box">
                <div class="receipt-amount-title">Total Pagado</div>
                <div class="receipt-amount-val" id="rec-amount">$0.00 MXN</div>
            </div>

            <!-- Download Button -->
            <button id="btn-download-pdf" class="btn btn-primary btn-submit">
                <i class="fa-solid fa-file-pdf"></i> Descargar Recibo PDF
            </button>
        </section>
    </main>

    <!-- Footer -->
    <footer class="simple-footer">
        <p>&copy; 2026 NERAM - ART. Todos los derechos reservados.</p>
    </footer>

    <!-- Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Theme Toggle
            const themeToggleBtn = document.getElementById('theme-toggle');
            const currentTheme = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-theme', currentTheme);
            updateThemeIcon(currentTheme);

            themeToggleBtn.addEventListener('click', () => {
                let theme = document.documentElement.getAttribute('data-theme');
                let newTheme = (theme === 'dark') ? 'light' : 'dark';
                document.documentElement.setAttribute('data-theme', newTheme);
                localStorage.setItem('theme', newTheme);
                updateThemeIcon(newTheme);
            });

            function updateThemeIcon(theme) {
                const icon = themeToggleBtn.querySelector('i');
                icon.className = theme === 'dark' ? 'fa-solid fa-sun' : 'fa-solid fa-moon';
            }

            // Parse Query Parameters
            const params = new URLSearchParams(window.location.search);
            const student = params.get('alumno') || 'Alumno';
            const tutor = params.get('tutor') || 'Tutor';
            const concept = params.get('concepto') || 'Taller de Dibujo';
            const amount = params.get('cantidad') || '0';
            const dateVal = params.get('fecha') || new Date().toISOString().split('T')[0];

            // Formatear Fecha
            let formattedDate = dateVal;
            try {
                const parts = dateVal.split('-');
                if (parts.length === 3) {
                    const dateObj = new Date(parts[0], parts[1] - 1, parts[2]);
                    formattedDate = dateObj.toLocaleDateString('es-ES', {
                        day: 'numeric',
                        month: 'long',
                        year: 'numeric'
                    });
                }
            } catch (e) {
                console.error(e);
            }

            // Formatear Cantidad
            const formattedAmount = parseFloat(amount).toLocaleString('es-MX', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

            // Rellenar UI
            document.getElementById('rec-student').textContent = student;
            document.getElementById('rec-tutor').textContent = tutor;
            document.getElementById('rec-concept').textContent = concept;
            document.getElementById('rec-date').textContent = formattedDate;
            document.getElementById('rec-amount').textContent = `$${formattedAmount} MXN`;

            // Descargar PDF (Nativo con jsPDF para evitar pantallas en blanco y asegurar colores)
            const btnDownload = document.getElementById('btn-download-pdf');
            btnDownload.addEventListener('click', () => {
                // Crear instancia de jsPDF (A5 vertical, unidad en mm)
                const { jsPDF } = window.jspdf;
                const doc = new jsPDF({
                    orientation: 'portrait',
                    unit: 'mm',
                    format: 'a5'
                });

                // --- DIBUJAR MARCOS ---
                // Marco exterior burgundy (#9c0738)
                doc.setDrawColor(156, 7, 56);
                doc.setLineWidth(1);
                doc.rect(8, 8, 132, 194);
                
                // Marco interior gris claro
                doc.setDrawColor(220, 220, 220);
                doc.setLineWidth(0.5);
                doc.rect(10, 10, 128, 190);

                // --- CABECERA ---
                // Barra de color vino arriba
                doc.setFillColor(156, 7, 56);
                doc.rect(10, 10, 128, 8, 'F');

                // Logotipo / Nombre
                doc.setFont("helvetica", "bold");
                doc.setFontSize(22);
                doc.setTextColor(156, 7, 56);
                doc.text("NERAM - ART", 74, 34, { align: "center" });

                // Eslogan
                doc.setFont("helvetica", "normal");
                doc.setFontSize(9);
                doc.setTextColor(110, 110, 110);
                doc.text("L I B E R A   T U   C R E A T I V I D A D", 74, 40, { align: "center" });

                // Línea divisora
                doc.setDrawColor(227, 228, 230);
                doc.setLineWidth(0.5);
                doc.line(20, 48, 128, 48);

                // --- TÍTULO ---
                doc.setFont("helvetica", "bold");
                doc.setFontSize(14);
                doc.setTextColor(32, 34, 38);
                doc.text("COMPROBANTE DE PAGO", 74, 58, { align: "center" });

                // --- DETALLES DEL PAGO (TABLA) ---
                const details = [
                    { label: "Fecha de Pago:", value: formattedDate },
                    { label: "Alumno:", value: student },
                    { label: "Tutor:", value: tutor },
                    { label: "Concepto:", value: concept }
                ];

                let currentY = 72;
                details.forEach(item => {
                    // Etiqueta (Izquierda)
                    doc.setFont("helvetica", "normal");
                    doc.setFontSize(9.5);
                    doc.setTextColor(103, 107, 115);
                    doc.text(item.label, 22, currentY + 6);
                    
                    // Valor (Derecha)
                    doc.setFont("helvetica", "bold");
                    doc.setFontSize(10);
                    doc.setTextColor(32, 34, 38);
                    doc.text(String(item.value), 126, currentY + 6, { align: "right" });
                    
                    // Línea divisora
                    doc.setDrawColor(242, 242, 242);
                    doc.line(22, currentY + 11, 126, currentY + 11);
                    
                    currentY += 14;
                });

                // --- CAJA DE TOTAL ---
                doc.setFillColor(251, 240, 243);
                doc.setDrawColor(245, 214, 223);
                doc.roundedRect(22, 134, 104, 26, 4, 4, 'FD');

                doc.setFont("helvetica", "bold");
                doc.setFontSize(8.5);
                doc.setTextColor(156, 7, 56);
                doc.text("TOTAL RECIBIDO", 74, 142, { align: "center" });

                doc.setFont("helvetica", "bold");
                doc.setFontSize(17);
                doc.setTextColor(156, 7, 56);
                doc.text(`$${formattedAmount} MXN`, 74, 152, { align: "center" });

                // --- PIE DE PÁGINA ---
                doc.setFont("helvetica", "italic");
                doc.setFontSize(9);
                doc.setTextColor(100, 100, 100);
                doc.text("¡Muchas gracias por tu confianza! 🎨", 74, 178, { align: "center" });

                doc.setFont("helvetica", "normal");
                doc.setFontSize(8);
                doc.setTextColor(140, 140, 140);
                doc.text("Contacto: neram1402@gmail.com", 74, 185, { align: "center" });

                // Descargar PDF
                const cleanStudentName = student.toLowerCase().replace(/[^a-z0-9]/g, '_');
                doc.save(`recibo_${cleanStudentName}.pdf`);
            });
        });
    </script>
</body>
</html>
